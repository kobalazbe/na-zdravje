<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ff6b6b" />
  <meta name="description" content="Na Zdravje! — digitalna pivska igra za 2–10 igralcev. Ena naprava, kup smeha." />
  <title>Na Zdravje! 🍻 — Pivska igra</title>

  <!-- social share card (the game link itself also gets shared directly) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Na Zdravje!" />
  <meta property="og:locale" content="sl_SI" />
  <meta property="og:url" content="https://nazdravje.top/index.html" />
  <meta property="og:title" content="Na Zdravje! 🍻 — pivska igra za 2–10 prijateljev" />
  <meta property="og:description" content="Vprašanja, izzivi in skupinske akcije na enem telefonu. Trenutno je vse brezplačno — omejena ponudba ob zagonu." />
  <meta property="og:image" content="https://nazdravje.top/img/og-cover.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Na Zdravje! — digitalna pivska igra za 2–10 prijateljev" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Na Zdravje! 🍻 — pivska igra za 2–10 prijateljev" />
  <meta name="twitter:description" content="Vprašanja, izzivi in skupinske akcije na enem telefonu. Trenutno vse brezplačno." />
  <meta name="twitter:image" content="https://nazdravje.top/img/og-cover.png" />

  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" id="ati" href="" />

  <!-- Vercel Web Analytics: cookieless, no personal data, no consent banner
       needed. Vercel is already a documented processor (see privacy.html).
       Returns 404 until Web Analytics is enabled in the Vercel dashboard. -->
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <div id="bg-blobs" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
    <i class="confetti c1"></i>
    <i class="confetti dot c2"></i>
    <i class="confetti bar c3"></i>
    <i class="confetti c4"></i>
    <i class="confetti dot c5"></i>
    <i class="confetti bar c6"></i>
    <i class="confetti c7"></i>
    <i class="confetti dot c8"></i>
    <i class="confetti c9"></i>
    <i class="confetti bar c10"></i>
    <i class="confetti dot c11"></i>
    <i class="confetti c12"></i>
  </div>

  <main id="app" aria-live="polite"></main>

  <canvas id="confetti" aria-hidden="true"></canvas>

  <script>
    (function () {
      try {
        var c = document.createElement('canvas');
        c.width = c.height = 192;
        var x = c.getContext('2d');
        var r = 40;
        x.fillStyle = '#ff6b6b';
        x.beginPath();
        x.moveTo(r, 0); x.lineTo(192 - r, 0);
        x.arcTo(192, 0, 192, r, r); x.lineTo(192, 192 - r);
        x.arcTo(192, 192, 192 - r, 192, r); x.lineTo(r, 192);
        x.arcTo(0, 192, 0, 192 - r, r); x.lineTo(0, r);
        x.arcTo(0, 0, r, 0, r);
        x.closePath(); x.fill();
        x.font = '120px serif';
        x.textAlign = 'center';
        x.textBaseline = 'middle';
        x.fillText('🍻', 96, 100);
        document.getElementById('ati').href = c.toDataURL();
      } catch (e) { /* ignore */ }
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js');
      }
    })();
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
